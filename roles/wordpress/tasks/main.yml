---
# roles/wordpress/tasks/main.yml

# Step 3a + 3b: Установка WordPress и зависимостей

# 1. Установка пакетов для WordPress
- name: Install required packages
  ansible.builtin.apt:
    name: 
      - apache2
      - php
      - php-pear
      - php-cgi
      - php-common
      - php-curl
      - php-mbstring
      - php-gd
      - php-mysqlnd
      - php-bcmath
      - php-json
      - php-xml
      - php-intl
      - php-zip
      - php-imap
      - php-imagick
      - libapache2-mod-php
      - wget
      - unzip
    update_cache: yes
    state: present

# 2. Включение и запуск Apache
- name: Enable Apache service
  ansible.builtin.systemd:
    name: apache2
    enabled: true
    masked: no
    state: started

# 3. Распаковка WordPress
- name: Unarchive WordPress
  ansible.builtin.unarchive:
    src: https://wordpress.org/latest.tar.gz
    dest: /var/www/html/
    remote_src: yes
    owner: codio
    group: www-data
    extra_opts: [--strip-components=1]

# 4. Создание wp-config.php из шаблона
- name: Update wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: /var/www/html/wp-config.php

# 5. Настройка прав доступа и владельца
- name: Change file ownership, group and permissions
  ansible.builtin.file:
    path: /var/www/html
    owner: codio
    group: www-data
    mode: u=rwX,g=rwX,o=rX
    recurse: true
    state: directory

# 6. Удаление старого index.html
- name: Remove old index.html
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

# Step 3c: Конфигурация Apache

# 7. Включение .htaccess файлов и установка заголовков
- name: Enable .htaccess files in Apache config
  ansible.builtin.replace:
    path: /etc/apache2/apache2.conf
    regexp: 'AllowOverride None'
    replace: |
      AllowOverride All
      RequestHeader set X-Forwarded-Proto "https"
      RequestHeader set X-Forwarded-Port "443"
  notify:
    - restart apache2

# 8. Включение модуля mod_headers
- name: Create a symbolic link for mod_headers
  ansible.builtin.file:
    src: /etc/apache2/mods-available/headers.load
    dest: /etc/apache2/mods-enabled/headers.load
    state: link
  notify:
    - restart apache2

# 9. Замена порта Apache на 3000
- name: Enables port 3000
  ansible.builtin.replace:
    path: /etc/apache2/ports.conf
    regexp: 'Listen 80'
    replace: 'Listen 3000'
  notify:
    - restart apache2
